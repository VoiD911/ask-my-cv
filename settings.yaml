environment: dev          # "prod" exige un VISITOR_SALT secret (variable d'environnement)
trusted_proxy: none       # "cloudfront" uniquement si l'API n'est joignable que par CloudFront
cors_origins: []   # origine du site en production (plan 1e)

cv_path: data/cv.md
index_path: data/index.json
prompt_path: prompts/answer@v3.md
embed_dim: 256

default_model: ollama:gemma3
fallback_chain: [ollama:gemma3, fake:echo]
models:
  - id: ollama:gemma3
    provider: ollama
    model: "gemma3:1b"
    public: true
  - id: fake:echo
    provider: fake
    public: true

top_k: 5
injection_threshold: 0.5
detector: onnx
model_manifest: models/prod.json
daily_cap_usd: 0.5
per_visitor_limit: 10
visitor_window_s: 3600
stage_timeout_s: 20
first_token_timeout_s: 8   # au-delà, bascule sur le fournisseur suivant
llm_deadline_s: 30         # délai global de l'étape llm, toutes tentatives comprises
allowed_contacts:
  - job@stevelang.net
visitor_salt: change-me
