[project]
name = "ask-my-cv"
version = "0.1.0"
description = "Interroge mon CV : RAG instrumenté de bout en bout"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "numpy>=2.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "onnxruntime>=1.20",
  "boto3>=1.43.64",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-PyYAML>=6.0",
  "moto[dynamodb,ssm]>=5.1",
]
ml = [
  "scikit-learn>=1.5",
  "skl2onnx>=1.17",
  "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_my_cv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "ml"]
typeCheckingMode = "standard"
