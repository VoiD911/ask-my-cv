services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      VISITOR_SALT: ${VISITOR_SALT:-dev-salt}
      ASK_ENVIRONMENT: dev

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  ollama: {}
