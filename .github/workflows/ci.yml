name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Outils lancés depuis leurs images officielles épinglées par digest (pas d'actions tierces).
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks parcourt tout l'historique
          persist-credentials: false
      - name: Secrets (gitleaks, tout l'historique)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner --exit-code 1
      - name: Code (semgrep)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b semgrep scan --metrics=off \
            --config p/python --config p/dockerfile --config p/github-actions --config p/secrets \
            --config p/typescript --config p/react --error
      - name: Dépendances (osv-scanner)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source \
            --lockfile /src/uv.lock --lockfile /src/web/package-lock.json --lockfile /src/evals/package-lock.json
      - name: IaC (trivy config)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 config \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore.yaml /src/infra

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12 --group ml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Récupérer et vérifier le modèle promu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version models/prod.json)
          if [ "$VERSION" = "null" ]; then echo "Aucun modèle promu : détecteur heuristique."; exit 0; fi
          gh release download "model-$VERSION" -p model.onnx -p model.onnx.sigstore.json -D models
          echo "$(jq -r .sha256 models/prod.json)  models/model.onnx" | sha256sum -c -
          echo "COSIGN_NEEDED=1" >> "$GITHUB_ENV"
      - if: env.COSIGN_NEEDED == '1'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Vérifier la signature du modèle
        if: env.COSIGN_NEEDED == '1'
        run: |
          cosign verify-blob models/model.onnx \
            --bundle models/model.onnx.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/train.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - run: docker build -t ask-my-cv:ci .
      - name: Imports de chaque module dans l'image
        run: docker run --rm --entrypoint .venv/bin/python ask-my-cv:ci scripts/check_imports.py
      - name: Scan de l'image (trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore.yaml ask-my-cv:ci
      - name: SBOM CycloneDX (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 \
            ask-my-cv:ci -o cyclonedx-json=/out/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name smoke -p 8000:8000 -e VISITOR_SALT="$(openssl rand -hex 32)" ask-my-cv:ci
          docker run --rm --entrypoint test ask-my-cv:ci -x /opt/extensions/lambda-adapter
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

  # Garanties du pipeline prouvées de bout en bout sur l'API locale : faux LLM
  # (settings.ci.yaml), classifieur ONNX promu, suite promptfoo evals/pr.yaml, puis
  # parcours e2e du site (web/out servi par web/e2e/serve.mjs, /api relayé vers l'API).
  evals:
    runs-on: ubuntu-latest
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_DISABLE_SHARING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12
      - name: Récupérer et vérifier le modèle promu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version models/prod.json)
          if [ "$VERSION" = "null" ]; then echo "::error::aucun modèle promu : settings.ci.yaml exige detector: onnx"; exit 1; fi
          gh release download "model-$VERSION" -p model.onnx -p model.onnx.sigstore.json -D models
          echo "$(jq -r .sha256 models/prod.json)  models/model.onnx" | sha256sum -c -
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Vérifier la signature du modèle
        run: |
          cosign verify-blob models/model.onnx             --bundle models/model.onnx.sigstore.json             --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/train.yml@refs/heads/main"             --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Index du CV
        run: ASK_SETTINGS=settings.ci.yaml uv run python -m ask_my_cv.ingest
      - name: Démarrer l'API locale (faux LLM)
        run: |
          ASK_SETTINGS=settings.ci.yaml VISITOR_SALT="$(openssl rand -hex 32)"             nohup uv run uvicorn --factory ask_my_cv.app:create_app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS 127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            evals/package-lock.json
            web/package-lock.json
      # --ignore-scripts : aucun script d'installation des dépendances n'est exécuté
      - run: npm ci --prefix evals --ignore-scripts --no-audit --no-fund
      - name: Tests du lecteur SSE et des assertions
        run: node --test evals/*.test.js
      - name: Suite promptfoo (PR)
        run: npx --prefix evals promptfoo eval -c evals/pr.yaml --no-cache --no-write --no-progress-bar --no-table -o evals/output/pr.json
      # Parcours e2e du site dans ce job plutôt que dans `web` : l'API locale (modèle promu
      # vérifié, index du CV, faux LLM) y tourne déjà ; un job dédié referait tout cela.
      - name: Site statique pour l'e2e
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          npm --prefix web run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Navigateur Playwright (chromium)
        run: npx --prefix web playwright install --with-deps chromium
      - name: Parcours e2e (Playwright, API locale)
        run: npm --prefix web run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Journal de l'API
        if: failure()
        run: cat api.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evals-pr-${{ github.sha }}
          path: evals/output/pr.json
          retention-days: 14
          if-no-files-found: ignore

  # Site statique (Next.js, export dans web/out) : lint, types, tests unitaires, build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --ignore-scripts : aucun script d'installation n'est exécuté. Next (SWC), Tailwind
      # (oxide, lightningcss) et TypeScript livrent leurs binaires natifs sous forme de
      # paquets optionnels par plateforme (@next/swc-linux-x64-gnu, ...) : pas besoin de
      # postinstall.
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-out-${{ github.sha }}
          path: web/out
          retention-days: 14
          if-no-files-found: error

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive infra
      - run: |
          for root in infra/bootstrap infra/prod; do
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
          done

  deploy:
    needs: [test, evals, terraform, security, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    environment:
      name: production
      url: https://job.stevelang.net
    permissions:
      contents: read
      id-token: write      # Sigstore keyless, OIDC AWS
      packages: write      # miroir ghcr.io/void911/ask-my-cv
      attestations: write  # provenance SLSA et SBOM (attestations GitHub)
    env:
      AWS_REGION: ca-central-1
      GHCR_IMAGE: ghcr.io/void911/ask-my-cv
      # Identité Sigstore exigée partout : ce workflow, sur main. Chaque vérification cosign
      # y ajoute --certificate-github-workflow-sha "$GITHUB_SHA" (lien au commit déployé).
      SIGNER_ID: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      CRANE: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      FUNCTION_NAME: ask-my-cv-api
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Récupérer et vérifier le modèle promu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version models/prod.json)
          gh release download "model-$VERSION" -p model.onnx -p model.onnx.sigstore.json -D models
          echo "$(jq -r .sha256 models/prod.json)  models/model.onnx" | sha256sum -c -
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: |
          cosign verify-blob models/model.onnx \
            --bundle models/model.onnx.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/train.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # Identifiants GHCR pour cosign et les actions d'attestation (push-to-registry).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et pousser l'image
        run: |
          IMAGE="$ECR_REPOSITORY_URL:$GITHUB_SHA"
          # Le dépôt ECR est IMMUTABLE : un rejeu du déploiement pour le même commit ne doit
          # pas échouer sur un push en doublon.
          if aws ecr describe-images --repository-name ask-my-cv --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "image déjà présente"
            REPLAY=1
          else
            REPLAY=0
            docker build --platform linux/amd64 --provenance=false --sbom=false -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          # Tout ce qui suit (SBOM, signature, vérification, déploiement) vise ce digest exact,
          # jamais le tag.
          DIGEST=$(aws ecr describe-images --repository-name ask-my-cv --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [[ "$DIGEST" != sha256:* ]]; then echo "::error::digest introuvable : $DIGEST"; exit 1; fi
          echo "IMAGE_REF=$ECR_REPOSITORY_URL@$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          # Rejeu : l'image n'a pas été construite par cette exécution. On ne la signe ni ne
          # l'atteste à l'aveugle : elle doit déjà porter une signature de ci.yml@main émise
          # pour ce commit. Contrepartie assumée : une exécution morte entre le push ECR et la
          # signature ne se rattrape pas par un rejeu (tag ECR immuable) ; il faut un nouveau
          # commit.
          if [ "$REPLAY" = 1 ] && ! cosign verify "$ECR_REPOSITORY_URL@$DIGEST" \
              --certificate-identity "$SIGNER_ID" --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-github-workflow-sha "$GITHUB_SHA" >/dev/null; then
            echo "::error::image ECR $GITHUB_SHA préexistante sans signature de ci.yml@main pour ce commit : origine inconnue, rien n'est signé ni déployé. Pousser un nouveau commit."
            exit 1
          fi
      - name: Miroir public sur GHCR (même digest)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # crane copie de registre à registre les octets exacts du manifeste : le digest GHCR
          # est celui d'ECR, que l'image vienne d'être construite ou non (rejeu). Pas de
          # docker tag/push : docker recompresserait les couches, sans garantie de digest.
          # Identifiants dans un DOCKER_CONFIG jetable, jamais affichés.
          CFG="$RUNNER_TEMP/crane"
          mkdir -m 700 "$CFG"
          trap 'rm -rf "$CFG"' EXIT
          crane() {
            docker run --rm -i --user "$(id -u):$(id -g)" -e DOCKER_CONFIG=/cfg -v "$CFG:/cfg" "$CRANE" "$@"
          }
          aws ecr get-login-password --region "$AWS_REGION" \
            | crane auth login "${ECR_REPOSITORY_URL%%/*}" -u AWS --password-stdin
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          TARGET="$GHCR_IMAGE:$GITHUB_SHA"
          # Toute erreur de lecture (tag absent, mais aussi réseau ou 401) mène à la copie :
          # sans danger, la copie depuis ECR par digest est idempotente et le digest obtenu est
          # contrôlé ci-dessous.
          if GOT=$(crane digest "$TARGET" 2>/dev/null); then
            echo "image déjà présente sur GHCR"
          else
            for attempt in 1 2 3 4 5; do
              if crane copy "$IMAGE_REF" "$TARGET" && GOT=$(crane digest "$TARGET"); then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::copie vers GHCR impossible après 5 essais"; exit 1; fi
              echo "::warning::essai $attempt en échec"
              sleep $((attempt * 15))
            done
          fi
          if [ "$GOT" != "$IMAGE_DIGEST" ]; then
            echo "::error::digest GHCR $GOT différent du digest ECR $IMAGE_DIGEST"
            exit 1
          fi
          echo "GHCR_REF=$GHCR_IMAGE@$IMAGE_DIGEST" >> "$GITHUB_ENV"
      - name: SBOM de l'image poussée
        run: |
          # syft lit l'image dans ECR (mode registry:), donc le SBOM décrit exactement le digest
          # poussé, y compris quand l'image existait déjà (rejeu : aucune image locale).
          # Identifiants passés par variables d'environnement plutôt qu'en montant
          # ~/.docker : indépendant de la façon dont docker login range ses secrets. Le jeton
          # (12 h) n'est jamais affiché (ni set -x ni echo) ; syft le masque dans ses journaux.
          SYFT_REGISTRY_AUTH_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
          export SYFT_REGISTRY_AUTH_PASSWORD
          docker run --rm \
            -e SYFT_REGISTRY_AUTH_AUTHORITY="${ECR_REPOSITORY_URL%%/*}" \
            -e SYFT_REGISTRY_AUTH_USERNAME=AWS \
            -e SYFT_REGISTRY_AUTH_PASSWORD \
            -v "$PWD:/out" anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 \
            "registry:$IMAGE_REF" -o cyclonedx-json=/out/sbom.cdx.json
          test -s sbom.cdx.json
      - name: Signer l'image et attester le SBOM (Sigstore keyless)
        id: sign
        # cosign 3 : bundles Sigstore poussés comme référents OCI (valeurs par défaut) ;
        # identifiants ECR et GHCR lus dans ~/.docker/config.json (amazon-ecr-login,
        # docker/login-action). Chaque signature ou attestation n'est émise que si aucune
        # valide n'existe déjà pour ce digest et ce commit : pas de doublons au rejeu.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STRICT=(--certificate-identity "$SIGNER_ID" --certificate-oidc-issuer "$OIDC_ISSUER"
            --certificate-github-workflow-sha "$GITHUB_SHA")
          cosign verify "$IMAGE_REF" "${STRICT[@]}" >/dev/null 2>&1 \
            || cosign sign --yes "$IMAGE_REF"
          cosign verify-attestation "$IMAGE_REF" --type cyclonedx "${STRICT[@]}" >/dev/null 2>&1 \
            || cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"
          cosign verify "$GHCR_REF" "${STRICT[@]}" >/dev/null 2>&1 \
            || cosign sign --yes "$GHCR_REF"
          GH_STRICT=(-R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA")
          if gh attestation verify "oci://$GHCR_REF" "${GH_STRICT[@]}" >/dev/null 2>&1; then
            echo "provenance=present" >> "$GITHUB_OUTPUT"
          fi
          if gh attestation verify "oci://$GHCR_REF" "${GH_STRICT[@]}" \
              --predicate-type https://cyclonedx.org/bom >/dev/null 2>&1; then
            echo "sbom=present" >> "$GITHUB_OUTPUT"
          fi
      # Attestations GitHub (dépôt public) sur l'image GHCR, poussées aussi dans le registre :
      # vérifiables par tous avec `gh attestation verify`.
      - name: Provenance SLSA (GHCR)
        if: steps.sign.outputs.provenance != 'present'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Attestation du SBOM (GHCR)
        if: steps.sign.outputs.sbom != 'present'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Vérifier signature et attestation avant déploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STRICT=(--certificate-identity "$SIGNER_ID" --certificate-oidc-issuer "$OIDC_ISSUER"
            --certificate-github-workflow-sha "$GITHUB_SHA")
          cosign verify "$IMAGE_REF" "${STRICT[@]}" >/dev/null
          cosign verify-attestation "$IMAGE_REF" --type cyclonedx "${STRICT[@]}" >/dev/null
          echo "signature et SBOM vérifiés pour $IMAGE_REF"
          cosign verify "$GHCR_REF" "${STRICT[@]}" >/dev/null
          GH_STRICT=(-R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA")
          gh attestation verify "oci://$GHCR_REF" "${GH_STRICT[@]}" >/dev/null
          gh attestation verify "oci://$GHCR_REF" "${GH_STRICT[@]}" --predicate-type https://cyclonedx.org/bom >/dev/null
          echo "signature, provenance SLSA et SBOM vérifiés pour $GHCR_REF"
      - name: Déployer (par digest)
        run: |
          # Digest actuellement servi (ResolvedImageUri), pour un retour arrière exact.
          PREVIOUS=$(aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query Code.ResolvedImageUri --output text)
          if [[ "$PREVIOUS" == *@sha256:* ]]; then
            echo "PREVIOUS_IMAGE=$PREVIOUS" >> "$GITHUB_ENV"
          else
            echo "::warning::image précédente inconnue ($PREVIOUS) : pas de retour arrière possible"
          fi
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_REF" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
      - name: Test de fumée de production
        id: smoke
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 infra/scripts/smoke_prod.py "$SITE_URL"
      - name: Publication du site ignorée (SITE_BUCKET non défini)
        if: env.SITE_BUCKET == ''
        run: |
          echo "::notice::SITE_BUCKET non défini : publication du site (S3 + CloudFront) ignorée."
      - name: Récupérer l'export statique du site (job web)
        if: env.SITE_BUCKET != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-out-${{ github.sha }}
          path: web/out
      - name: Publier le site (S3)
        if: env.SITE_BUCKET != ''
        run: |
          # 1er passage : uniquement les fichiers hachés (_next/static/**), cache immuable 1 an.
          # Pas de --delete ici : un chunk haché disparu d'un ancien build ne gêne personne
          # (nom différent à chaque contenu) et le supprimer romprait un client en plein
          # chargement d'une page encore servie avec l'ancien build.
          aws s3 sync web/out/_next/static "s3://$SITE_BUCKET/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          # 2e passage : HTML et tout le reste, non caché ; --delete nettoie ce qui a disparu du
          # build, sans jamais toucher _next/static (exclu ci-dessous, donc protégé du --delete).
          aws s3 sync web/out "s3://$SITE_BUCKET" \
            --cache-control "no-cache" \
            --exclude "_next/static/*" \
            --delete
      - name: Invalider le cache CloudFront (site)
        if: env.SITE_BUCKET != '' && env.DISTRIBUTION_ID != ''
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$ID"
      - name: Test de fumée du site statique
        if: env.SITE_BUCKET != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl -fsS "${SITE_URL%/}/" | grep -q "Interroge mon CV"
          curl -fsS "${SITE_URL%/}/api/healthz" | grep -q '"status"'
      - name: Retour arrière si le test de fumée échoue
        if: failure() && steps.smoke.outcome == 'failure' && env.PREVIOUS_IMAGE != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          echo "::error::test de fumée en échec : retour à $PREVIOUS_IMAGE"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$PREVIOUS_IMAGE" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          # Contrôle léger seulement : le test de fumée complet épuise le quota horaire de l'IP.
          if ! curl -fsS --retry 5 --retry-all-errors --max-time 30 "${SITE_URL%/}/api/healthz"; then
            echo "::error::retour arrière effectué mais /api/healthz ne répond pas : intervention manuelle"
            exit 1
          fi
          echo
          echo "::error::retour arrière effectué : $PREVIOUS_IMAGE est de nouveau en service"
