name: weekly

# Résumé hebdomadaire de l'usage réel (#143) : chaque lundi (≈ 8 h à Montréal), courriel en
# français sur le sujet SNS des alertes, à partir des spans `ask` publics (Logs Insights).
# Rôle OIDC de nuit, déjà limité à Logs Insights sur aws/spans ; il ajoute sns:Publish sur ce
# seul sujet et la clé KMS du sujet via SNS (infra/bootstrap/main.tf). Lancement manuel :
# essai par défaut (le message est affiché dans le journal, rien n'est publié).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai : afficher le résumé sans le publier"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    environment: nightly
    permissions:
      contents: read
      id-token: write
    env:
      # Secret d'environnement `nightly` : masque le numéro de compte dans les journaux publics
      # (ARN du rôle, erreurs AWS), comme les jobs de nightly.yml.
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      # planifié : envoi réel ; manuel : essai sauf décision contraire
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Vérifier le masquage du compte AWS
        run: |
          if ! test -n "$AWS_ACCOUNT_ID"; then
            echo "::error::secret AWS_ACCOUNT_ID absent de l'environnement : le numéro de compte ne serait plus masqué dans les journaux publics"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen --python 3.12
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_NIGHTLY_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Résumé hebdomadaire
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            uv run python infra/scripts/weekly_summary.py --dry-run
          else
            uv run python infra/scripts/weekly_summary.py
          fi
