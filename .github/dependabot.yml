version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv # GA depuis mars 2025 : met à jour pyproject.toml et uv.lock ensemble
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    # Majeures bloquées par l'écosystème : eslint-config-next (plugins react, import,
    # jsx-a11y) plafonne ESLint à 9 ; typescript-eslint et le contrôle de types de
    # `next build` exigent l'API JS de TypeScript, absente de TypeScript 7 (natif).
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /evals
    schedule: { interval: weekly }
    groups:
      evals: { patterns: ["*"] }
